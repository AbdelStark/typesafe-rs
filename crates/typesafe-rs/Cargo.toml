[package]
name = "typesafe-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true
description = "Rust client for TypeSafe's System One API"
readme = "../../README.md"
keywords = ["typesafe", "sdk", "system-one", "ai", "http-client"]
categories = ["api-bindings", "web-programming::http-client"]
documentation = "https://docs.rs/typesafe-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["rustls", "tracing"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
blocking = ["tokio/rt", "tokio/net"]
tracing = ["dep:tracing"]

[dependencies]
bytes = { workspace = true }
fastrand = { workspace = true }
http = { workspace = true }
httpdate = { workspace = true }
indexmap = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true, optional = true }
url = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
typesafe-rs-mock = { path = "../typesafe-rs-mock", version = "0.1.0" }

[[example]]
name = "quickstart"
doc-scrape-examples = true

[[example]]
name = "triage"
doc-scrape-examples = true

[[example]]
name = "models"

[[example]]
name = "blocking"
required-features = ["blocking"]

[[test]]
name = "blocking"
required-features = ["blocking"]

[lints]
workspace = true
